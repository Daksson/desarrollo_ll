<h1>Personajes de Star Wars</h1>

<div class="search">
  <input
    #searchInput
    (keyup.enter)="onSearch(searchInput.value)"
    type="text"
    placeholder="Buscar por nombre"
  />
  <button (click)="onSearch(searchInput.value)">Buscar</button>
</div>

@if (loading()) {
  <p class="message">Cargando...</p>
}

@if (error()) {
  <p class="message error">{{ error() }}</p>
}

@if (!loading() && !error() && characters().length === 0) {
  <p class="message">No se encontraron personajes.</p>
}

<p class="total">{{ total() }} personajes encontrados</p>

<starwars-character-list [characters]="characters()"/>

<div class="pagination">
  <button (click)="previousPage()" [disabled]="!hasPrevious() || loading()">Anterior</button>
  <span>Página {{ page() }}</span>
  <button (click)="nextPage()" [disabled]="!hasNext() || loading()">Siguiente</button>
</div>
